<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grado — Real Colegio San José</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="franja-superior"></div>

<header class="encabezado">
  <div class="envoltura">
    <a class="marca" href="index.html">
      <img src="assets/logo.png" alt="Escudo Real Colegio San José">
      <span class="marca-texto">
        <strong>Real Colegio San José</strong>
        <span>Registro de estudiantes</span>
      </span>
    </a>
    <div class="migas"><a href="index.html">Inicio</a> / <a id="miga-nivel" href="#"></a></div>
  </div>
</header>

<main>
  <section class="hero-grado envoltura">
    <div class="hero-grado-grid">
      <div>
        <span class="pastilla" id="grado-pastilla-nivel"></span>
        <h1 id="grado-titulo"></h1>
        <p id="grado-descripcion-corta"></p>
        <div class="pastillas-fila">
          <span class="pastilla amarilla" id="grado-edad"></span>
        </div>
        <div class="hero-acciones">
          <a class="boton boton-primario boton-inscribirse" href="#">Inscribirme a este grado</a>
        </div>
      </div>
      <div class="galeria" id="galeria-cont"></div>
    </div>
  </section>

  <section class="descripcion-grado envoltura">
    <h2>Sobre este grado</h2>
    <p id="grado-descripcion"></p>
  </section>

  <section class="envoltura">
    <div class="franja-cta">
      <div>
        <h3>¿Listo para dar el paso?</h3>
        <p>El formulario toma solo unos minutos.</p>
      </div>
      <a class="boton boton-amarillo boton-inscribirse" href="#">Inscribirme a este grado</a>
    </div>
  </section>

  <section class="envoltura" style="padding-bottom:60px;">
    <div id="grado-nav" style="display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap;"></div>
  </section>
</main>

<footer class="pie">
  <div class="envoltura">
    <p>Real Colegio San José — Popayán, Cauca</p>
    <p><a href="index.html">← Volver al inicio</a></p>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/iconos.js"></script>
<script src="js/main.js"></script>
<script>initGrado();</script>
</body>
</html>
