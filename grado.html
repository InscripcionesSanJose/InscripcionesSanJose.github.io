  <section class="descripcion-grado envoltura">
    <h2 data-campo="sobre_titulo">Sobre este grado</h2>

  </section>

  <section class="envoltura">
    <div class="franja-cta">
      <div>
        <h3 data-campo="cta_titulo">¿Listo para dar el paso?</h3>
        <p data-campo="cta_descripcion">El formulario toma solo unos minutos.</p>
      </div>
      <a class="boton boton-amarillo boton-inscribirse" href="#" data-campo="btn_inscribirme_2">Inscribirme a este grado</a>
    </div>
  </section>

  <section class="envoltura" style="padding-bottom:60px;">
    <div id="grado-nav" style="display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap;"></div>
  </section>
